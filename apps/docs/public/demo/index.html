<!doctype html>
<!--
  Static notice served at /demo/, standing in for the retired hosted board build.
  Starlight copies apps/docs/public/ into dist/, so this becomes dist/demo/index.html.
  DELETE THIS FILE if a hosted board is ever published at /demo/ again — otherwise it
  will shadow the board's own index.html.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hosted demo retired — pgxsinkit</title>
    <style>
      body {
        margin: 0;
        padding: 3rem 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
        color: #1b1b1f;
        background: #fff;
      }
      main {
        max-width: 38rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 1rem;
      }
      a {
        color: #2b5fd9;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e6e6e9;
          background: #17171c;
        }
        a {
          color: #8ab0ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hosted demo retired</h1>
      <p>
        The public pgxsinkit board demo is no longer hosted. The board itself still ships in the repository and runs
        locally against the full read and write paths.
      </p>
      <p>
        <a href="/demo-and-harness/">How to run the board locally</a> &middot;
        <a href="/">pgxsinkit documentation</a>
      </p>
    </main>
  </body>
</html>
