name: Demo reset

# RETIRED 2026-08-21, and no longer scheduled. The hosted board /demo (board ADR-0009) it reset is
# retired — Electric Cloud is being shut down, and the demo's read path was the classic Electric path
# removed in ADR-0055 — so there is no nightly backend to restore. `workflow_dispatch` is kept
# deliberately: the job is still the supported way to rebuild a cloud board database from the
# committed migration history, which is useful whether or not a demo is hosted, and restoring the
# nightly cadence is just putting the `schedule:` block back. (The DEMO_BOARD_* variables and secrets
# it reads can be unset in repo settings; the `if:` gate then skips it.)
#
# Full rebuild of a hosted board's shared backend: purge → migrate → reseed.
#
# The /demo was a PUBLIC, signed-in-as-a-fixture, writable board — anyone could create/move issues and
# post chat. This job restored it to the known seeded fixtures every night so vandalism (offensive
# issue titles, chat spam) never persisted — and it rebuilds the SCHEMA, not just the rows:
#   1. `purge:board` drops every migration-created board object in public (model-derived drop list)
#      plus the `drizzle` bookkeeping schema;
#   2. `db:board:migrate` re-applies the latest committed history from scratch;
#   3. `seed:board` recreates the deterministic identities + fixtures.
# That makes the cloud database effectively ephemeral (the same posture as every other database these
# migrations target — docs/runbooks/regenerate-migrations.md), so a rewritten/collapsed history ships
# by simply dispatching this workflow — no hand-reconciling `drizzle.__drizzle_migrations`. The
# function bundles are separate: deploy those with `bun run board:cloud:functions` from a linked CL.
# All three steps are the exact scripts used locally and by `board:cloud:*`, pointed at the cloud via
# env. DDL through the SESSION pooler is fine — privileges hang off the `postgres.<ref>` role, not the
# connection path (the direct host is IPv6-only and unreachable from GitHub runners; see below).
#
# It talks ONLY to the managed services (GoTrue admin API + the project's Postgres via the Supavisor
# SESSION pooler); no containers of any kind, no Pages deploy. Inputs:
#   - var    DEMO_BOARD_SUPABASE_URL   the project URL (public; the GoTrue admin gateway)
#   - secret DEMO_BOARD_SECRET_KEY     the project's sb_secret_… key (admin API auth)
#   - secret DEMO_BOARD_DATABASE_URL   the SESSION pooler connection (pooler host, port 5432,
#     user postgres.<ref>) — truncate + insert as `postgres`. NOT the direct connection: that host
#     is IPv6-only and GitHub-hosted runners have no outbound IPv6, so the first query dies with
#     "Connection closed" (run 28500294690). Session mode (not the 6543 transaction pooler) keeps
#     the seed's prepared statements on one backend connection.
#
# The fixtures use the in-script shared password (`board-demo-password`) the login screen publishes —
# a public demo's sign-in password is public by design, so there is nothing to inject here.
#
# Gated on the public variable so a fork (which has neither the variable nor the secrets) skips it
# instead of failing. If a public board is ever hosted again, disable open signups on the Supabase
# project so the only accounts are the seeded fixtures (the reset truncates all board ROWS regardless
# of author, but only deletes the FIXTURE auth identities).

on:
  # No `schedule:` — retired, see above. Restoring the nightly cadence means adding it back.
  workflow_dispatch: # manual reset on demand

concurrency:
  group: demo-reset
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-26.04
    if: ${{ vars.DEMO_BOARD_SUPABASE_URL != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Purge the board's migration objects
        run: bun run purge:board
        env:
          BOARD_DATABASE_URL: ${{ secrets.DEMO_BOARD_DATABASE_URL }}
      - name: Migrate from the latest committed history
        run: bun run db:board:migrate
        env:
          BOARD_DATABASE_URL: ${{ secrets.DEMO_BOARD_DATABASE_URL }}
      - name: Reseed the fixtures
        run: bun run seed:board
        env:
          BOARD_GATEWAY_URL: ${{ vars.DEMO_BOARD_SUPABASE_URL }}
          BOARD_SECRET_KEY: ${{ secrets.DEMO_BOARD_SECRET_KEY }}
          BOARD_DATABASE_URL: ${{ secrets.DEMO_BOARD_DATABASE_URL }}
