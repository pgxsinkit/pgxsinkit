name: Docs

# Builds the Astro Starlight site (apps/docs) and deploys the static output to the
# pgxsinkit/pgxsinkit.github.io repo (served at the bare root https://pgxsinkit.github.io)
# via a least-privilege deploy key. Mirrors conform-ed's docs deploy (conform-ed ADR-0014):
# the bare-root org-pages URL must come from the `<owner>.github.io` repo, so the build is
# pushed there rather than served from this repo.
#
# The hosted board /demo (board ADR-0009) is RETIRED and is no longer built here. Electric Cloud is
# being shut down, and the demo's read path was the classic Electric path removed in ADR-0055. A
# static notice page (`apps/docs/public/demo/index.html`) now occupies /demo/ — Starlight copies
# `public/` into `dist/`, so it ships with the site and needs no step of its own.
#
# Re-enabling it (internal note): delete that notice page, and restore a step that runs
# `bun run demo:build` AFTER the docs build and BEFORE the deploy. The board must be built into
# `apps/docs/dist/demo/` so docs + demo deploy as ONE atomic artifact — peaceiris uses force_orphan,
# so co-publishing rather than a second racing workflow is the only way the demo survives a docs
# deploy. The step took VITE_BOARD_SUPABASE_URL / VITE_BOARD_PUBLISHABLE_KEY / VITE_BOARD_FUNCTIONS_REGION
# from public DEMO_BOARD_* repo variables, and was gated on them so forks still got a clean docs
# deploy. On the native read path that backend also needs a hosted Circuits engine + durable-streams,
# which nothing in this repo provisions — see docs/runbooks/board-on-cloud.md.
#
# Prerequisites (one-time, GitHub-side):
#   - a `pgxsinkit/pgxsinkit.github.io` repo exists
#   - this repo has a `PGXSINKIT_PAGES_DEPLOY_KEY` secret (an SSH deploy key whose public half
#     is registered as a write-enabled deploy key on pgxsinkit.github.io)

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/perf-lab/**"
      - "packages/**"
      - "brand/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run --cwd apps/docs build
      # Build the storage benchmark page into apps/docs/dist/bench so it co-deploys at /bench/
      # (`bun run bench:publish`). Runs AFTER the docs build (which regenerates dist) and before the
      # deploy, for the same force_orphan reason as the retired /demo. Dependency-free with no
      # secrets, so it always runs.
      - name: Build the storage benchmark page /bench
        run: bun run bench:publish
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PGXSINKIT_PAGES_DEPLOY_KEY }}
          external_repository: pgxsinkit/pgxsinkit.github.io
          publish_dir: ./apps/docs/dist
          publish_branch: main
          force_orphan: true
          commit_message: "deploy docs from pgxsinkit/pgxsinkit@${{ github.sha }}"
