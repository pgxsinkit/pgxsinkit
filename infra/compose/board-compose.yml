# Board demo — a TRIMMED but VERSION-MATCHED self-hosted Supabase + Circuits stack (board ADR-0001).
#
# Mirrors the official Supabase self-hosted compose at a single matched release (image tags + their
# UNMODIFIED init scripts in ./board/db-init = Supabase's own roles.sql + jwt.sql). We never modify a
# Supabase-owned schema object — the board touches only the `public` schema (its drizzle migrations).
# This is what lets the same board run unchanged against cloud Supabase (BaaS): there, Supabase owns
# the platform; here we just stand up a faithful local mirror.
#
# Trimmed vs. full self-hosted: dropped realtime, storage, imgproxy, analytics, vector, supavisor
# (Storage/attachments are a board v2). Kept: db / auth / rest / meta + studio / envoy / functions
# (edge-runtime) + the Circuits stack (durable-streams + engine). Board-only ports so it coexists with
# the harness. Every service connects
# as `postgres`/`authenticator`/`supabase_auth_admin` (passwords set to ${POSTGRES_PASSWORD} by the
# image + the official roles.sql). Bring up with `bun run infra:up`.

name: pgxsinkit-board

services:
  db:
    image: docker.io/supabase/postgres:17.6.1.143
    container_name: board-db
    # No `command:` override here, deliberately. The image's default CMD is `postgres -D /etc/postgresql`
    # — it keeps its configuration OUTSIDE the data directory, so replacing the command drops the `-D`
    # and postgres exits before it can start. And there is nothing to override: this image already ships
    # `wal_level = logical` (Realtime needs it) plus replication slots, which is all the engine's slot
    # requires. Verify with `postgres -C wal_level` rather than re-adding flags.
    # Supabase's OWN init scripts (vendored byte-unmodified), mounted at the SAME paths the official
    # self-hosted compose uses. Order matters: the image's migrate.sh runs init-scripts/*.sql under
    # `set -e`, so 99-roles.sql (which ALTERs supabase_functions_admin's password) MUST be preceded by
    # 98-webhooks.sql, which creates that role. Omitting webhooks.sql makes roles.sql fail, which
    # aborts migrate.sh before it runs the image's own migrations/ set — including the migration that
    # hands auth.uid/role/email to supabase_auth_admin, which GoTrue needs to boot. webhooks.sql is
    # self-contained (only needs pg_net, bundled in the image); we don't run DB webhooks, but it's the
    # role's birthplace in the official chain. jwt.sql sets the database JWT GUCs.
    volumes:
      - ./board/db-init/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./board/db-init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./board/db-init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: docker.io/supabase/gotrue:v2.192.0
    container_name: board-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${BOARD_API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${BOARD_SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      # New asymmetric auth (board ADR-0007): with GOTRUE_JWT_KEYS set, GoTrue SIGNS sessions ES256 and
      # exposes the public key at /auth/v1/.well-known/jwks.json; the board functions verify ES256-only.
      # GOTRUE_JWT_SECRET is still a REQUIRED boot key (GoTrue refuses to start without it) — it is the
      # symmetric compatibility key required by GoTrue itself, never used in the board's auth path.
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS}
      GOTRUE_JWT_ISSUER: ${BOARD_API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # No mail server in the demo: confirm signups automatically so admin-API-seeded users log in.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    ports:
      - "54334:9999"

  # NB: PostgREST (the `rest` service) is intentionally absent. The board does not use the auto-CRUD
  # data API — reads are subscribed through board-sync (the control plane, which compiles the
  # registry's row filter into a shape) and served by board-stream (the edge), and writes go through
  # board-write (the governed mutation ingress) — and exposing it would let an authenticated user
  # bypass board-write to reach tables directly. RLS governs every table regardless, but dropping the
  # service + its gateway route removes the surface entirely. (Studio's table editor needs PostgREST, so
  # it is non-functional here; schema introspection via postgres-meta still works.)

  meta:
    image: docker.io/supabase/postgres-meta:v0.96.6
    container_name: board-meta
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: docker.io/supabase/studio:2026.07.07-sha-a6a04f2
    container_name: board-studio
    depends_on:
      - meta
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: pgxsinkit-board
      DEFAULT_PROJECT_NAME: board
      SUPABASE_URL: http://envoy:8000
      SUPABASE_PUBLIC_URL: ${BOARD_API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${BOARD_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_KEY: ${BOARD_SECRET_KEY}
    ports:
      - "54333:3000"

  # Envoy API gateway (board ADR-0007/0008). Supabase's self-hosted stack is moving to an Envoy-based
  # gateway; the board mirrors it (board/envoy.yaml). It terminates the board's single origin (:54331),
  # routes /auth/v1 + /functions/v1, and runs the new-API-key → role-JWT translation Lua filter (the
  # same job the Cloud gateway does) while leaving a signed-in user's session JWT untouched.
  envoy:
    image: docker.io/envoyproxy/envoy:v1.38.3
    container_name: board-envoy
    depends_on:
      - auth
      - functions
    volumes:
      - ./board/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "54331:8000"

  # caddy — TLS-terminating HTTP/2 + HTTP/3 front for the gateway (board dogfooding finding). The
  # browser holds one durable-streams long-poll connection PER subscribed stream — 6 for the board (the
  # TEAM_SCOPE group's team/team_member/channel/issue, plus singleton profile + message), and K scopes
  # would mean K streams. Over plain HTTP/1.1 the
  # browser's ~6-connections-per-origin cap is fully consumed by those long-polls, so board-write (and
  # chat sends) sit Stalled in the browser's queue for a whole long-poll cycle (~6–13s) before they are
  # even dispatched — the demo's "writes are slow" symptom. h2/h3 multiplex every request over ONE
  # connection, so the cap never binds. A real deployment already serves h2 over TLS at its gateway
  # (istio); this gives the local demo the same property. The cert is a mkcert-issued localhost cert
  # (infra:up generates it into ./certs; the local mkcert CA is already trusted, which h3/QUIC needs).
  # The browser talks https://localhost:54343; tests + seed scripts still use envoy directly on 54331.
  caddy:
    image: docker.io/caddy:2.11.4-alpine
    container_name: board-caddy
    depends_on:
      - envoy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      - "54343:54343/tcp"
      - "54343:54343/udp" # HTTP/3 (QUIC)

  functions:
    image: docker.io/supabase/edge-runtime:v1.74.2
    container_name: board-functions
    depends_on:
      db:
        condition: service_healthy
    # The vendored official main router (functions-dist/main) dispatches /board-write, /board-sync and
    # /board-stream to their bundled workers (scripts/build-edge-functions.ts). VERIFY_JWT=false: each
    # board function verifies its own credential — board-write and board-sync the GoTrue token
    # (apps/board-api/src/core/auth.ts), board-stream the stream token board-sync minted — keeping that
    # the single, runtime-portable auth point.
    command: ["start", "--main-service", "/home/deno/functions/main"]
    volumes:
      - ../../supabase/functions-dist:/home/deno/functions:ro
    environment:
      VERIFY_JWT: "false"
      # The board functions verify each GoTrue session token against the project JWKS, fetched from
      # `${SUPABASE_URL}/auth/v1/.well-known/jwks.json` (board ADR-0007). No JWT_SECRET (no HS256).
      SUPABASE_URL: http://envoy:8000
      SUPABASE_ANON_KEY: ${BOARD_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${BOARD_SECRET_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # board-sync (control plane) talks to the engine; board-stream (edge) proxies to durable-streams.
      # Neither is client-reachable — reaching them is what the two functions are for.
      CIRCUITS_ENGINE_URL: http://engine:7010
      DURABLE_STREAMS_URL: http://ds:8791
      # One secret: board-sync mints stream tokens with it and board-stream verifies them.
      STREAM_TOKEN_SECRET: ${BOARD_STREAM_TOKEN_SECRET:-board-dev-stream-token-secret}
      BOARD_ALLOWED_ORIGINS: ${BOARD_SITE_URL},http://localhost:5174
      # Keep a board-sync long-poll worker alive ~10min instead of the stock 60s, so the read path
      # is not forced to reconnect every minute when the worker hits its wall-clock budget (read by
      # the vendored main router). Demo realism: Cloud Supabase manages worker lifetime for you.
      EDGE_WORKER_TIMEOUT_MS: "600000"

  # The log the board's clients actually READ from, through board-stream. Published image, pinned —
  # as is every image in this stack, the engine included: nothing here is built from a checkout.
  #
  # Override with PGXSINKIT_DS_IMAGE to run a different build (e.g. the pgxsinkit fork's own image,
  # ghcr.io/pgxsinkit/durable-streams-rust:sha-<short>, which is what staging will pin — upstream's
  # Docker Hub namespace belongs to an acquired company and has no second publisher).
  ds:
    image: ${PGXSINKIT_DS_IMAGE:-docker.io/electricax/durable-streams-server-rust:0.1.5}
    container_name: board-ds
    # FLAGS, not environment. This binary reads no env vars at all — `DS_PORT`/`DS_DATA_DIR`/`DS_MEMORY`
    # were invented here and silently ignored, leaving it on its own default (4437) while the engine
    # dialled ds:8791 and got ECONNREFUSED. Nothing caught it: podman's rootlessport accepts the HOST
    # connection whether or not anything is behind it, so a TCP readiness probe passes regardless.
    # In-memory BY DEFAULT because the board replays from Postgres on every bring-up, so
    # fsync-per-append would buy durability nothing here reads (`--durability` takes wal|memory and
    # rejects anything else). Set PGXSINKIT_DS_DURABILITY=wal to boot the demo on the mode staging
    # will actually run.
    #
    # `--data-dir` is passed EXPLICITLY and always: the server refuses `--durability wal` with a
    # defaulted data dir (the default is a temp dir, so wal would fsync every append and discard it
    # on restart), so the override would not start without it. Deliberately NOT backed by a volume —
    # this path is in the container's writable layer, so the demo stays ephemeral per bring-up.
    # STAGING MUST MOUNT A VOLUME HERE — see docs/backlog for the k8s/Helm note.
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8791"
      - "--durability"
      - "${PGXSINKIT_DS_DURABILITY:-memory}"
      - "--data-dir"
      - "/var/lib/durable-streams"
    ports:
      - "54341:8791"
    # No healthcheck: this image is scratch — a static Rust binary with no shell and no curl, so
    # `CMD-SHELL` (which runs `/bin/sh -c`) can never execute and the container would sit "starting"
    # until compose gave up. Dependents wait on `service_started` instead, and readiness is gated from
    # the HOST, where a TCP probe can actually run.

  # The Circuits engine: replication ingest, shape maintenance, and the control API board-sync calls.
  # The published image of the pgxsinkit FORK of electric-circuits: that repo's own `docker.yml` builds
  # `docker/Dockerfile.engine` on every push to its `main` and publishes `main` + `sha-<short>`. Pinned
  # by sha tag like everything else here, never `main` — the demo must not silently change engine
  # because the fork moved. To iterate on the engine itself, build a checkout (`podman build -f
  # docker/Dockerfile.engine -t localhost/electric-circuits-engine:dev .`) and point
  # PGXSINKIT_CIRCUITS_ENGINE_IMAGE at the tag.
  engine:
    container_name: board-engine
    image: ${PGXSINKIT_CIRCUITS_ENGINE_IMAGE:-ghcr.io/pgxsinkit/electric-circuits/engine:sha-474577a}
    environment:
      ELECTRIC_CIRCUITS_DS_URL: http://ds:8791
      ELECTRIC_CIRCUITS_PG_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Explicit table list, never `*`: `*` introspects every public table with a primary key, which
      # sweeps in the operations log (pgmq is untouched: it lives in schema `pgmq`, not `public`).
      ELECTRIC_CIRCUITS_PG_TABLES: ${BOARD_CIRCUITS_PG_TABLES:?set the explicit board table list}
      ELECTRIC_CIRCUITS_BIND: 0.0.0.0:7010
    depends_on:
      db:
        condition: service_healthy
      ds:
        # `service_started`, not `service_healthy`: the ds image can express no healthcheck (see above).
        # A start race is covered by this service's own `restart` — the same retry the table check uses.
        condition: service_started
    # The engine exits if its tables are absent; a restart is the retry, and migrations land between.
    restart: unless-stopped
    ports:
      - "54342:7010"

  # warmer — keeps the board-write + board-sync edge workers hot (board dogfooding finding).
  #
  # Self-hosted edge-runtime suspends an idle user worker within ~15s and evicts a cold one's module
  # cache after longer idle. Without warming, a learner's first drag after a quiet period pays an
  # edge cold start: ~5.8s to import the board-write bundle, or ~0.45s to re-establish the worker's
  # Postgres connection after a shorter idle — felt as the convergence dot lingering for seconds even
  # though the sync rail itself is fast (~75ms read-path echo, ~20ms apply). A cheap request every 8s
  # keeps the workers active, so real writes stay ~20ms. The empty-`mutations` POST is rejected at
  # validation (400) *before* any DB work — the cheapest request that still reaches the worker — while
  # `board-sync/sync/v1/barrier` and `board-stream/v1/stream/warm` warm the two read surfaces without
  # needing a subject or a stream token. Pure demo realism: a managed BaaS
  # (Cloud Supabase) keeps functions warm for you, so nothing like this ships in the app.
  warmer:
    image: docker.io/curlimages/curl:8.21.0
    container_name: board-warmer
    depends_on:
      - envoy
    environment:
      BOARD_PUBLISHABLE_KEY: ${BOARD_PUBLISHABLE_KEY}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -o /dev/null -X POST "http://envoy:8000/functions/v1/board-write/api/mutations" \
            -H "apikey: $$BOARD_PUBLISHABLE_KEY" -H "Authorization: Bearer $$BOARD_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{"mutations":[]}' 2>/dev/null || true
          curl -fsS -o /dev/null "http://envoy:8000/functions/v1/board-sync/sync/v1/barrier" \
            -H "apikey: $$BOARD_PUBLISHABLE_KEY" -H "Authorization: Bearer $$BOARD_PUBLISHABLE_KEY" 2>/dev/null || true
          curl -fsS -o /dev/null "http://envoy:8000/functions/v1/board-stream/v1/stream/warm" \
            -H "apikey: $$BOARD_PUBLISHABLE_KEY" -H "Authorization: Bearer $$BOARD_PUBLISHABLE_KEY" 2>/dev/null || true
          sleep 8
        done
