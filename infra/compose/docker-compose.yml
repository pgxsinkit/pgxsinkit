services:
  postgres:
    image: docker.io/supabase/postgres:17.6.1.116
    # Not optional: the engine creates its own replication slot at startup and fails closed without it.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10"]
    volumes:
      - ./entrypoint-masks/init-scripts:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${PGXSINKIT_INTEGRATION_POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${PGXSINKIT_INTEGRATION_POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      POSTGRES_DB: ${PGXSINKIT_INTEGRATION_POSTGRES_DB:-postgres}
      POSTGRES_INITDB_SKIP_SCRIPTS: ${PGXSINKIT_INTEGRATION_POSTGRES_SKIP_INIT_SCRIPTS:-false}
    ports:
      - "${PGXSINKIT_INTEGRATION_POSTGRES_PORT:-54321}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${PGXSINKIT_INTEGRATION_POSTGRES_USER:-supabase_admin} -d ${PGXSINKIT_INTEGRATION_POSTGRES_DB:-postgres}
      interval: 2s
      timeout: 3s
      retries: 20

  # The log the client actually READS from. Official published image, pinned — only the engine is
  # built from source, and only because it needs the repo's Dockerfile.
  ds:
    image: docker.io/electricax/durable-streams-server-rust:0.1.5
    environment:
      DS_PORT: 8791
      DS_DATA_DIR: /data
      # In-memory: the lane replays from Postgres on every run, so paying fsync-per-append would buy
      # durability that nothing here reads.
      DS_MEMORY: "1"
    ports:
      - "${PGXSINKIT_DS_PORT:-8791}:8791"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8791 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The Circuits engine: replication ingest, shape maintenance, and the control plane the pgxsinkit
  # server talks to (POST /shapes, GET /replication/lsn). Built from an electric-circuits checkout —
  # a Rust release build, which is why `infra:harness:up` requires an explicit `--build`.
  #
  # The EDGE is deliberately absent: it is TypeScript in `packages/server` (ADR-0055 decision 8), so
  # the lane runs it in-process, which is also what lets a test revoke an entitlement between polls.
  engine:
    build:
      context: ${PGXSINKIT_CIRCUITS_REPO:?set PGXSINKIT_CIRCUITS_REPO to an electric-circuits checkout}
      dockerfile: docker/Dockerfile.engine
    environment:
      ELECTRIC_CIRCUITS_DS_URL: http://ds:8791
      ELECTRIC_CIRCUITS_PG_URL: postgres://${PGXSINKIT_INTEGRATION_POSTGRES_USER:-supabase_admin}:${PGXSINKIT_INTEGRATION_POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@postgres:5432/${PGXSINKIT_INTEGRATION_POSTGRES_DB:-postgres}
      # Explicit table list, never `*`: `*` introspects every public table with a primary key, which
      # sweeps in the operations log and pgmq's own relations (docs/research/0001).
      ELECTRIC_CIRCUITS_PG_TABLES: ${PGXSINKIT_CIRCUITS_PG_TABLES:?set the explicit table list}
      ELECTRIC_CIRCUITS_BIND: 0.0.0.0:7010
    ports:
      - "${PGXSINKIT_CIRCUITS_ENGINE_PORT:-7010}:7010"
    depends_on:
      postgres:
        condition: service_healthy
      ds:
        condition: service_healthy
    # The engine exits if its tables are absent; a restart is the retry, and migrations land between.
    restart: unless-stopped
