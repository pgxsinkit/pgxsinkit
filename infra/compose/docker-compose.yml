services:
  postgres:
    image: docker.io/supabase/postgres:17.6.1.116
    # No `command:` override here, deliberately. The image's default CMD is `postgres -D /etc/postgresql`
    # — it keeps its configuration OUTSIDE the data directory, so replacing the command drops the `-D`
    # and postgres exits before it can start. And there is nothing to override: this image already ships
    # `wal_level = logical` (Realtime needs it) plus replication slots, which is all the engine's slot
    # requires. Verify with `postgres -C wal_level` rather than re-adding flags.
    volumes:
      - ./entrypoint-masks/init-scripts:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${PGXSINKIT_INTEGRATION_POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${PGXSINKIT_INTEGRATION_POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      POSTGRES_DB: ${PGXSINKIT_INTEGRATION_POSTGRES_DB:-postgres}
      POSTGRES_INITDB_SKIP_SCRIPTS: ${PGXSINKIT_INTEGRATION_POSTGRES_SKIP_INIT_SCRIPTS:-false}
    ports:
      - "${PGXSINKIT_INTEGRATION_POSTGRES_PORT:-54321}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${PGXSINKIT_INTEGRATION_POSTGRES_USER:-supabase_admin} -d ${PGXSINKIT_INTEGRATION_POSTGRES_DB:-postgres}
      interval: 2s
      timeout: 3s
      retries: 20

  # The log the client actually READS from. Official published image, pinned — as is every image in
  # this stack, the engine included: nothing here is built from a checkout.
  ds:
    image: docker.io/electricax/durable-streams-server-rust:0.1.5
    # FLAGS, not environment. This binary reads no env vars at all — `DS_PORT`/`DS_DATA_DIR`/`DS_MEMORY`
    # were invented here and silently ignored, leaving it on its own default (4437) while the engine
    # dialled ds:8791 and got ECONNREFUSED. Nothing caught it: podman's rootlessport accepts the HOST
    # connection whether or not anything is behind it, so a TCP readiness probe passes regardless.
    # In-memory because the lane replays from Postgres on every run, so fsync-per-append would buy
    # durability nothing here reads (`--durability` takes wal|memory and rejects anything else).
    command: ["--host", "0.0.0.0", "--port", "8791", "--durability", "memory"]
    ports:
      - "${PGXSINKIT_DS_PORT:-8791}:8791"
    # No healthcheck: this image is scratch — a static Rust binary with no shell and no curl, so
    # `CMD-SHELL` (which runs `/bin/sh -c`) can never execute and the container would sit "starting"
    # until compose gave up. Dependents wait on `service_started` instead, and readiness is gated from
    # the HOST, where a TCP probe can actually run.

  # The Circuits engine: replication ingest, shape maintenance, and the control plane the pgxsinkit
  # server talks to (POST /shapes, GET /replication/lsn). The published image of the pgxsinkit FORK of
  # electric-circuits: that repo's own `docker.yml` builds `docker/Dockerfile.engine` on every push to
  # its `main` and publishes `main` + `sha-<short>`. Pinned by sha tag like everything else here, never
  # `main` — a lane must not silently change engine because the fork moved. To iterate on the engine
  # itself, build a checkout (`podman build -f docker/Dockerfile.engine -t
  # localhost/electric-circuits-engine:dev .`) and point PGXSINKIT_CIRCUITS_ENGINE_IMAGE at the tag.
  #
  # The EDGE is deliberately absent: it is TypeScript in `packages/server` (ADR-0055 decision 8), so
  # the lane runs it in-process, which is also what lets a test revoke an entitlement between polls.
  engine:
    image: ${PGXSINKIT_CIRCUITS_ENGINE_IMAGE:-ghcr.io/pgxsinkit/electric-circuits/engine:sha-0d336cf}
    environment:
      ELECTRIC_CIRCUITS_DS_URL: http://ds:8791
      ELECTRIC_CIRCUITS_PG_URL: postgres://${PGXSINKIT_INTEGRATION_POSTGRES_USER:-supabase_admin}:${PGXSINKIT_INTEGRATION_POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@postgres:5432/${PGXSINKIT_INTEGRATION_POSTGRES_DB:-postgres}
      # Explicit table list, never `*`: `*` introspects every public table with a primary key, which
      # sweeps in the operations log and pgmq's own relations (docs/research/0001).
      ELECTRIC_CIRCUITS_PG_TABLES: ${PGXSINKIT_CIRCUITS_PG_TABLES:?set the explicit table list}
      ELECTRIC_CIRCUITS_BIND: 0.0.0.0:7010
    ports:
      - "${PGXSINKIT_CIRCUITS_ENGINE_PORT:-7010}:7010"
    depends_on:
      postgres:
        condition: service_healthy
      ds:
        # `service_started`, not `service_healthy`: the ds image can express no healthcheck (see above).
        # A start race is covered by this service's own `restart` — the same retry the table check uses.
        condition: service_started
    # The engine exits if its tables are absent; a restart is the retry, and migrations land between.
    restart: unless-stopped
